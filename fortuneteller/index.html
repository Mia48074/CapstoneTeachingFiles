<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="https://glitch.com/favicon.ico" />
   

    <title>Fortune Teller</title>

    <!-- import the webpage's stylesheet -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <img src="/pictures/200000/cards/crystal-ball-14781928157ne.jpg.card-v2.webp?v=1788642915" srcset="/pictures/200000/cards/crystal-ball-14781928157ne.jpg.card-v2.webp?v=1788642915 640w, /pictures/200000/cards/crystal-ball-14781928157ne.jpg.card-v2.webp?v=1788642915 640w" sizes="(max-width: 620px) 50vw, (max-width: 900px) 33vw, (max-width: 1180px) 25vw, 20vw" width="640" height="480" alt="Crystal Ball" loading="lazy" decoding="async" class="pdp-thumbnail-foreground">
    <!-- this is the start of content -->
    <h1>
      Fortune Teller
    </h1>
    <form name="fortuneTeller" id="fortuneTeller" action="fortune.html">
      <label for="namefield">Name:</label>
      <input type="text" id="namefield" name="name" placeholder="your name" required>
      <br><br>
      <label for="questionfield">Question:</label>
      <input type="text" id="questionfield" name="question" placeholder="a yes or no question">
      <br><br>
      <label for="birthdate">Birth Date:</label>
      <input type="date" id="birthdate" name="birthdate">
      <br><br>
      <label for="luckyNumber">Lucky Number (1-10):</label>
      <input type="number" id="luckyNumber" name="luckyNumber" min="1" max="10">
      <br><br>
      <label for="terms">Agree to psychic terms:</label>
      <input type="checkbox" id="terms" name="terms" value="agreed">
      <br><br>
      <label for="satisfaction">Are you happy:</label>
      <select name = "satisfaction" id = "satisfaction">
        <option value = "very happy">Very happy</option>
        <option value = "happy">Happy</option>
        <option value = "not happy">Not happy</option>
      </select>
      <textarea name = "textarea" rows="3" cols="40">
        Thank you for your cooperation!
      </textarea>
      <input type="submit" value="Submit">
      <input type="reset" value="Reset">
    </form>
    <div id="fortune"></div>
  </body>
</html>
